<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alsama Arabic · Lebanese Arabic for Beginners</title>
  <meta name="description" content="Learn Lebanese Arabic with Alsama Language School.">
  <link rel="icon" href="assets/logo/alsama-language-school.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="site-header">
    <a class="header-logo" href="#/home" aria-label="Alsama Language School home">
      <img src="assets/logo/alsama-language-school.png" alt="">
    </a>
    <nav class="header-actions" aria-label="Main">
      <a class="header-student" id="header-student" href="#/who" hidden title="Switch learner"></a>
      <a class="header-link" href="#/about">About</a>
      <button class="icon-button" id="music-menu" type="button" aria-expanded="false"
              aria-controls="music-panel" aria-label="Music settings">🎵</button>
      <button class="icon-button" id="mute" type="button" aria-pressed="false" aria-label="Sound is on. Turn sound off">🔊</button>
      <div class="music-panel" id="music-panel" hidden>
        <button class="music-toggle" id="music-toggle" type="button" aria-pressed="true">🎵 Music on</button>
        <label for="music-volume">Music volume</label>
        <input id="music-volume" type="range" min="0" max="100" step="5" value="50">
        <p>The voice is always louder than the music.</p>
      </div>
    </nav>
  </header>
  <main id="app" tabindex="-1">
    <noscript>Please turn on JavaScript to use the Alsama Arabic app.</noscript>
  </main>
</body>
</html>
